events {}

http {
    # Лог-формат показує, який саме API-контейнер обслужив запит ($upstream_addr).
    log_format upstreamlog '$remote_addr -> $upstream_addr [$status] $request_time';
    access_log /var/log/nginx/access.log upstreamlog;

    # Docker Compose резолвить ім'я "api" у всі IP реплік цього сервісу при старті nginx.
    # Тому після зміни кількості реплік потрібен: docker compose restart nginx
    upstream api_backend {
        server api:10000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
