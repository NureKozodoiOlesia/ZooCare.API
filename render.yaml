services:
  - type: web
    name: zoocare-api
    env: dotnet
    plan: free
    buildCommand: dotnet restore ZooCare.API/ZooCare.API.csproj && dotnet build ZooCare.API/ZooCare.API.csproj -c Release
    startCommand: dotnet ZooCare.API/bin/Release/net8.0/ZooCare.API.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000

